name: tdoa-officeweb
title: 通达 OA OfficeWeb 服务日志(GBK)
kind: regex
line_regex: ^\[(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]\s+(?P<message>.*)$
field_map:
  ts: ts_raw
  message: message
ts_field: ts
ts_formats:
- '%Y-%m-%d %H:%M:%S'
encoding: gbk
status: draft
note: 实测于用户真实样本(mix_logs/OfficeWeb/OfficeWeb*.log,GBK 编码, 服务启停/进程管理类消息);行内时间为本地时间,归一走源声明时区。
