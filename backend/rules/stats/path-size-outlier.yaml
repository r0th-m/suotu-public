# 同路径字节离群(2026-08-08 用户狩猎思路固化):同样路径的访问,
# 返回字节相差较大(无论变大变小)可能有问题——组内找少数派。
id: path-size-outlier
title: 同路径响应尺寸离群(同键找叛徒)
operator: size_outlier
severity: medium
key_fields: [path, method, status]   # 同路径+同方法+同状态码才可比(防动态页误报)
metric: bytes
min_group_events: 20                 # 组内最小请求数(小样本不参与)
deviate_ratio: 3.0                   # 与中位数偏离超 3 倍(双向:偏大或偏小都算)
max_outliers: 3                      # 每组最多拎出 3 条离群行
note: >-
  依据(用户实战狩猎思路 2026-08-08):同路径访问返回字节显著分化(变大或
  变小都计)可能藏问题——攻击成功/失败页、数据泄露、webshell 响应与正常
  模板尺寸差异大。防误报:同状态码同方法同组、中位数基准(非均值)、
  组内 ≥20 次才参与。尺寸离群≠实锤,命中只进待审区交人复核;
  line_no 直指该次异常响应本身。
