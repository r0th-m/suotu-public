# 敏感路径探测:版本库/环境文件/后台/备份
id: sensitive-path
title: 敏感路径探测特征
severity: medium
target: web
match:
  path:
    - "/.git/"
    - "/.env"
    - "/.svn/"
    - "/.hg/"
    - "/wp-admin"
    - "/wp-login"
    - "/phpmyadmin"
    - "/backup."
    - "/config.php~"
    - "/web.config"
note: >-
  /.git/、/.env、/.svn/ 泄露源码与密钥,wp-admin/phpmyadmin 是后台探测
  高频目标,backup.*/config.php~ 是备份文件探测——均为公开攻击面知识
  (OWASP/各类目录字典的头部成员)。正常站点也可能真用 wp-admin,
  故 medium 进待审区,不自动定论。
