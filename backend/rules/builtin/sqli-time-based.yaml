# SQLi:时间盲注族(MySQL SLEEP/BENCHMARK、MSSQL WAITFOR、PostgreSQL pg_sleep)
id: sqli-time-based
title: SQL 注入时间盲注特征
severity: high
target: web
match:
  query:
    - "sleep("
    - "benchmark("
    - "waitfor delay"
    - "waitfor%20delay"
    - "pg_sleep"
note: >-
  时间盲注是主流数据库延型函数的通称:MySQL SLEEP()/BENCHMARK()、
  MSSQL WAITFOR DELAY、PostgreSQL pg_sleep()——出现在查询串里几乎
  无正常业务语义,属公开攻击知识(OWASP/sqlmap 手册)。
