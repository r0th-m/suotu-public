# 扫描器/攻击工具 User-Agent 指纹
id: scanner-ua
title: 扫描器 User-Agent 特征
severity: medium
target: web
match:
  ua:
    - "sqlmap"
    - "nikto"
    - "acunetix"
    - "netsparker"
    - "w3af"
    - "nmap"
    - "masscan"
    - "dirbuster"
    - "gobuster"
    - "hydra"
    - "nuclei"
    - "wpscan"
    - "nessus"
    - "openvas"
note: >-
  主流扫描/攻击工具的默认 UA 自我标识(sqlmap、Nikto、Acunetix、
  Netsparker、w3af、Nmap、masscan、dirbuster、gobuster、hydra 等),
  属公开工具指纹。UA 可伪造,命中只说明「自称」,严重级给 medium。
